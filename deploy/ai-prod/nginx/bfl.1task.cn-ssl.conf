# bfl2openai HTTPS 入口
# 证书：acme.sh（Let's Encrypt），HTTP-01（DNS 已指向本机），自动续期并 reload nginx。
# 限速：应用户要求已放开（2026-10-09）—— 无 limit_req；暴露面由服务自身控制。

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bfl.1task.cn;

    ssl_certificate     /www/server/panel/vhost/cert/bfl.1task.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/bfl.1task.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /www/wwwlogs/bfl.1task.cn.log;
    error_log  /www/wwwlogs/bfl.1task.cn.error.log;

    auth_basic off;   # 入口层不认证；服务侧鉴权由 BFL2OPENAI_API_KEY / BFL_NATIVE_API_KEY 控制（默认关）

    # 产物交付路径不设闸：轮询客户端的最后一次取图被 429 会弄坏交付
    # （实测：矩阵测试中轮询后的取图撞闸，429 HTML 覆盖了图片字节）。
    location ^~ /v1/flux3-image/results/ {
        include /www/server/panel/vhost/nginx/bfl-proxy.inc;
    }
    location ^~ /v1/images/results/ {
        include /www/server/panel/vhost/nginx/bfl-proxy.inc;
    }

    location / {
        include /www/server/panel/vhost/nginx/bfl-proxy.inc;
    }
}
