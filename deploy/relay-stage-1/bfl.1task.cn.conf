# bfl2openai 公网中转 —— stage-1 (103.207.68.201) → 源站 node-10 (64.178.99.49)
#
# 存在理由（2026-11-09 实测）：
#   64.178.99.0/24 到中国大陆方向丢包 50%+，且是「握手后每个小包都丢」而非仅 SYN。
#   本机到源站 0.33ms（同机房），大陆方向 0% 丢包。
#   直接访问源站时：/healthz 这种 239 字节响应要 6~18s，12 次里 4 次失败；
#   静默 40s 后复用连接 0/6 存活 —— 这正是同步 images 门（一次长请求）失败的原因。
#
# 回滚：把 DNS bfl.1task.cn 的 A 记录改回 64.178.99.49 即可。本文件不改变源站行为。
#
# 注意 so_keepalive：同步门在等上游出图时会有 15~45s 的完全静默，
#   期间没有任何包，客户端侧 NAT/防火墙会回收映射，响应回来时连接已经死了。
#   30s 空闲即发探测，把映射续上。

upstream bfl_origin {
    server 64.178.99.49:443;
    keepalive 32;
    keepalive_timeout 75s;
}

# 80 端口：只做两件事 —— 承接 ACME HTTP-01 验证并透传给源站、其余 301 到 https。
# 存在的必要性：DNS 指向本机后，Let's Encrypt 的验证请求会打到这台机器。
#   源站证书是宝塔签的、走 HTTP-01（webroot=/www/wwwroot/acme），
#   若这里不把 /.well-known/acme-challenge/ 透传过去，源站 58 天后续期必然失败。
server {
    listen 80;
    server_name bfl.1task.cn;

    # 本机优先（中转自己的证书续期落在本地目录），未命中则回落源站（源站宝塔续期）。
    # try_files 的 $uri 会拼到 root 下，即 /www/wwwroot/acme-bfl/.well-known/acme-challenge/xxx
    location /.well-known/acme-challenge/ {
        root /www/wwwroot/acme-bfl;
        try_files $uri @acme_origin;
    }

    location @acme_origin {
        proxy_pass http://64.178.99.49:80;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl so_keepalive=30s:10s:6;
    http2 on;
    server_name bfl.1task.cn;

    ssl_certificate     /www/server/panel/vhost/cert/bfl.1task.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/bfl.1task.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:BFLRELAY:10m;
    ssl_session_timeout 10m;

    access_log /www/wwwlogs/bfl.1task.cn.log;
    error_log  /www/wwwlogs/bfl.1task.cn.error.log;

    # 与源站 vhost 保持一致（multipart 上传 / 弱网上传空档）
    client_max_body_size 64m;
    client_body_timeout 300s;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass https://bfl_origin;
        proxy_ssl_server_name on;
        proxy_ssl_name bfl.1task.cn;
        proxy_ssl_verify on;
        # 源站是四级链（leaf → YE2 → Root YE → ISRG Root X2 → ISRG Root X1），
        # nginx 默认深度 1 会报 20:unable to get local issuer certificate
        proxy_ssl_verify_depth 5;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_session_reuse on;
    }
}
