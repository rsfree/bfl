[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bfl2openai"
version = "0.2.0"
description = "flux-tools.bfl.ai precise editing adapter: OpenAI Images + BFL native endpoints, MPS upscale to 4k/8k"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "curl_cffi>=0.7",
  "pillow>=10.0",
]

[tool.setuptools]
packages = ["bfl2openai"]

[tool.setuptools.package-data]
bfl2openai = ["py.typed"]
