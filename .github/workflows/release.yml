name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.next }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Resolve next version
        id: ver
        run: |
          set -euo pipefail
          PREV=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1 || true)
          BASE=${PREV:-v0.0.0}
          IFS=. read -r MA MI PA <<< "${BASE#v}"
          NEW="v${MA}.${MI}.$((PA + 1))"
          echo "prev=${PREV}" >> "$GITHUB_OUTPUT"
          echo "next=${NEW}" >> "$GITHUB_OUTPUT"
          echo "Previous: ${PREV:-<none>} -> Next: ${NEW}"

      - name: Build changelog
        id: log
        run: |
          set -euo pipefail
          PREV='${{ steps.ver.outputs.prev }}'
          if [ -z "$PREV" ]; then RANGE=HEAD; else RANGE="${PREV}..HEAD"; fi
          {
            echo 'body<<CHANGELOG_EOF'
            echo '## Changes'
            git log "$RANGE" --pretty='- %s (%h)' --no-merges || echo '- Initial release'
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify artifacts
        run: |
          set -euo pipefail
          test -d dist || { echo "::error::dist/ not found after build"; exit 1; }
          [ -n "$(ls -A dist)" ] || { echo "::error::dist/ is empty"; exit 1; }
          ls -la dist

      - name: Create tag
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # 幂等：重跑时 tag 已存在不炸（Release 步骤自带幂等）
          git rev-parse -q --verify "refs/tags/${{ steps.ver.outputs.next }}" \
            || git tag -a '${{ steps.ver.outputs.next }}' -m 'Release ${{ steps.ver.outputs.next }}'
          git push origin '${{ steps.ver.outputs.next }}'

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 幂等 + 防引号注入：notes 走文件（commit message 里的撇号曾打断
          # --notes '...' 的引号，整条发版链挂在 zsh "no matches found" 上）
          if gh release view '${{ steps.ver.outputs.next }}' >/dev/null 2>&1; then
            echo "release ${{ steps.ver.outputs.next }} already exists -- skip"
            exit 0
          fi
          echo '${{ steps.log.outputs.body }}' > /tmp/release_notes.md
          gh release create '${{ steps.ver.outputs.next }}' \
            --title 'Release ${{ steps.ver.outputs.next }}' \
            --notes-file /tmp/release_notes.md \
            dist/*

      - name: Move latest tag
        run: |
          set -euo pipefail
          git tag -f latest '${{ steps.ver.outputs.next }}'
          git push -f origin latest

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ steps.ver.outputs.next }}
          path: dist/
          retention-days: 30

  docker:
    # 同一个 tag 出镜像：push main → 自增版本 → 构建并推 GHCR。
    # 生产只 pull，不在服务器上 build（见 deploy/ai-prod/docker-compose.yml）。
    needs: release
    if: ${{ always() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tags
        id: tag
        run: |
          set -euo pipefail
          V='${{ needs.release.outputs.version }}'
          # GHCR tag 一律不带 v 前缀（与既有 jimeng/qwen 等镜像保持一致）
          echo "name=${V#v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${{ github.repository }}" >> "$GITHUB_OUTPUT"
          echo "${V#v} <- $V"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.name }}
            ${{ steps.tag.outputs.image }}:latest
            ${{ steps.tag.outputs.image }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify pushed image
        run: |
          set -euo pipefail
          docker buildx imagetools inspect \
            "${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.name }}" | head -12
